version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linguaguard-web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production
    restart: unless-stopped

  python-api:
    build:
      context: .
      dockerfile: linguaguard/Dockerfile
    container_name: linguaguard-python-api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  streamlit-dashboard:
    build:
      context: .
      dockerfile: linguaguard/Dockerfile
    container_name: linguaguard-python-streamlit
    ports:
      - "8501:8501"
    command: streamlit run linguaguard/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - python-api
    restart: unless-stopped
