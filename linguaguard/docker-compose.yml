version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: linguaguard/Dockerfile
    container_name: linguaguard-api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=production
    command: uvicorn linguaguard.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: linguaguard/Dockerfile
    container_name: linguaguard-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    command: streamlit run linguaguard/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
